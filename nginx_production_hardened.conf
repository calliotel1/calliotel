# 🏛️ DIGITAL COLOSSEUM - PRODUCTION NGINX CONFIGURATION
# Optimized for: High-concurrency WebSockets, Rate Limiting, SSL Hardening
# Deploy to: /etc/nginx/sites-available/calliotel.conf

# ⚡ RATE LIMITING ZONES
# These prevent spam and abuse across critical endpoints
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=global_square:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=duel_actions:10m rate=5r/s;

# WebSocket connection limits
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# Upstream backend service
upstream backend {
    server 127.0.0.1:8001;
    keepalive 64;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name calliotel.com www.calliotel.com;
    
    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name calliotel.com www.calliotel.com;
    
    # 🔒 SSL CERTIFICATE PATHS (Update after running Certbot)
    ssl_certificate /etc/letsencrypt/live/calliotel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calliotel.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/calliotel.com/chain.pem;
    
    # 🛡️ SSL HARDENING (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hide Nginx version
    server_tokens off;
    
    # 📁 STATIC FRONTEND (React Build)
    root /var/www/calliotel/frontend/build;
    index index.html;
    
    # Client body size (for file uploads)
    client_max_body_size 100M;
    
    # ⚔️ API ENDPOINTS WITH RATE LIMITING
    
    # Authentication endpoints (strict rate limit)
    location ~ ^/api/auth/(login|signup|reset-password) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Global Square broadcast (prevent spam)
    location /api/world/broadcast {
        limit_req zone=global_square burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Duel actions (prevent rapid-fire exploits)
    location ~ ^/api/duel/(challenge|accept|move) {
        limit_req zone=duel_actions burst=10 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # General API endpoints (moderate rate limit)
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 🔌 WEBSOCKET ENDPOINTS (CRITICAL FOR REAL-TIME FEATURES)
    location /ws/ {
        # Connection limit per IP
        limit_conn ws_conn 10;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers (CRITICAL)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for long-lived connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Prevent buffering for real-time data
        proxy_buffering off;
    }
    
    # 📁 STATIC FILE SERVING
    location /uploads/ {
        alias /var/www/calliotel/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        alias /var/www/calliotel/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # Health check endpoint (no rate limit)
    location /health {
        access_log off;
        return 200 "Digital Colosseum Online";
        add_header Content-Type text/plain;
    }
}
