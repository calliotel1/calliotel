version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: calliotel_mongodb_local
    restart: always
    volumes:
      - mongodb_data_local:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27018:27017"  # Use 27018 to avoid conflict with dev MongoDB
    networks:
      - calliotel_network_local
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod.local
    container_name: calliotel_backend_local
    restart: always
    ports:
      - "8002:8001"  # Map to 8002 to avoid conflict with dev backend
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./backend:/app
    networks:
      - calliotel_network_local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: calliotel_nginx_local
    restart: always
    ports:
      - "8080:80"  # Local production test on port 8080
    volumes:
      - ./nginx.conf.local:/etc/nginx/conf.d/default.conf
      - ./frontend/build:/usr/share/nginx/html
      - ./media:/var/www/calliotel/media
    depends_on:
      - backend
    networks:
      - calliotel_network_local

volumes:
  mongodb_data_local:
    driver: local

networks:
  calliotel_network_local:
    driver: bridge
